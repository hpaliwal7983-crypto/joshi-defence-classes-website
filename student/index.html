<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101914"><title>Joshi Defence Classes — Student</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--bg:#090a09;--panel:#171715;--panel2:#24231f;--gold:#f1c75b;--text:#f5f0e2;--muted:#b9b5a9;--line:#38352b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#292216 0,#0b0b09 48%,#070807 100%);color:var(--text);font:15px system-ui,Arial}header{padding:18px 5vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#090a09}.brand{font-weight:800}.brand span,h2{color:var(--gold)}main{max-width:1050px;margin:26px auto;padding:0 18px}.card{background:linear-gradient(145deg,#1b1a17,#131312);border:1px solid var(--line);border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 10px 28px #0005}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.item{background:#111110;border:1px solid var(--line);border-radius:12px;padding:15px}.muted,small{color:var(--muted)}input{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:#0e0e0d;color:var(--text);margin:6px 0 12px;font:inherit}button{background:linear-gradient(110deg,#ffe18a,var(--gold));color:#191407;border:0;border-radius:9px;padding:11px 16px;font-weight:750;cursor:pointer;margin:4px 5px 4px 0}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}nav{display:flex;gap:6px;flex-wrap:wrap}.tab.active{outline:2px solid var(--gold)}#message{color:var(--gold)}.hidden{display:none}a{color:var(--gold)}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px}h1{font-size:26px}@media(max-width:600px){main{margin:15px auto}.card{padding:15px}}</style></head>
<body><header><div class="brand">🛡️ JOSHI <span>DEFENCE CLASSES</span></div><div id="user" class="muted">Student Portal</div></header><main><div id="message" role="status" aria-live="polite"></div>
<section class="card" id="login"><h1>Student Login</h1><p class="muted">Phone number se OTP login karein. International format use karein, jaise +91XXXXXXXXXX.</p><label for="phone">Mobile number</label><input id="phone" type="tel" autocomplete="tel" placeholder="+91XXXXXXXXXX"><button id="sendOtp">Send OTP</button><div id="verify" class="hidden"><label for="otp">6 digit OTP</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"><button id="verifyOtp">Verify and sign in</button></div></section>
<section id="portal" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h1 id="welcome">Your learning</h1><p class="muted">Your account's enrolled batch content appears here.</p></div><button class="secondary" id="logout">Sign out</button></div><nav id="tabs"><button class="tab active" data-tab="live">Live classes</button><button class="tab" data-tab="recorded">Recorded</button><button class="tab" data-tab="pdfs">Study PDFs</button><button class="tab" data-tab="news">Announcements</button></nav></div><div id="content" class="grid"></div></section></main>
<script>
const SUPABASE_URL="https://ttadesyoupsljjbrcaxy.supabase.co",SUPABASE_KEY="sb_publishable_62pS83NmWYYky80N9a9Mow_Di2m0lEE",client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);let tab="live",profile=null;
function msg(t){$("message").textContent=t}
$("sendOtp").onclick=async()=>{const phone=$("phone").value.trim();if(!/^\+[1-9]\d{7,14}$/.test(phone))return msg("Valid international phone number enter karein.");const {error}=await client.auth.signInWithOtp({phone,options:{shouldCreateUser:false}});if(error)msg(error.message);else{$("verify").classList.remove("hidden");msg("OTP bhej diya gaya. SMS provider configured hona chahiye.")}};
$("verifyOtp").onclick=async()=>{const {data,error}=await client.auth.verifyOtp({phone:$("phone").value.trim(),token:$("otp").value.trim(),type:"sms"});if(error)msg(error.message);else await start(data.session)};
$("logout").onclick=async()=>{await client.auth.signOut();location.reload()};document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");tab=b.dataset.tab;loadContent()});
function card(title,description,action){const d=document.createElement("article");d.className="item";const h=document.createElement("h2");h.textContent=title;d.append(h);if(description){const p=document.createElement("p");p.className="muted";p.textContent=description;d.append(p)}if(action)d.append(action);return d}
function yt(url){try{const u=new URL(url);let id=u.hostname.includes("youtu.be")?u.pathname.slice(1):u.searchParams.get("v");if(!id&&u.pathname.includes("/live/"))id=u.pathname.split("/live/")[1].split("/")[0];if(!id&&u.pathname.includes("/embed/"))id=u.pathname.split("/embed/")[1].split("/")[0];return id&&/^[\w-]{11}$/.test(id)?id:null}catch{return null}}
async function loadContent(){const out=$("content");out.innerHTML="<p class='muted'>Loading…</p>";try{const {data:en,error:ee}=await client.from("enrollments").select("batch_id").eq("student_id",profile.id);if(ee)throw ee;const ids=(en||[]).map(x=>x.batch_id);if(!ids.length){out.innerHTML="";out.append(card("No batch assigned","Please contact the academy administrator."));return}let rows=[],error=null;if(tab==="recorded"){({data:rows,error}=await client.from("classes").select("*").in("batch_id",ids).eq("status","published").order("created_at",{ascending:false}))}else if(tab==="live"){({data:rows,error}=await client.from("live_sessions").select("*").in("batch_id",ids).in("status",["scheduled","live"]).order("scheduled_start",{ascending:true}))}else if(tab==="pdfs"){({data:rows,error}=await client.from("study_pdfs").select("id,title,batch_id,subject_id,status,created_at").in("batch_id",ids).eq("status","published").order("created_at",{ascending:false}))}else{({data:rows,error}=await client.from("announcements").select("*").eq("is_published",true).order("created_at",{ascending:false}))}if(error)throw error;out.innerHTML="";if(tab==="news")rows=(rows||[]).filter(x=>!x.target_batch_id||ids.includes(x.target_batch_id));for(const row of rows||[]){let d;if(tab==="pdfs"){const b=document.createElement("button");b.textContent="Open secure PDF";b.onclick=async()=>{b.disabled=true;try{const {data,error}=await client.functions.invoke("student-pdf-link",{body:{pdf_id:row.id}});if(error)throw error;if(data?.error)throw Error(data.error);window.open(data.signed_url,"_blank","noopener,noreferrer")}catch(e){msg(e.message)}finally{b.disabled=false}};d=card(row.title,"Private link expires in 5 minutes.",b)}else if(tab==="recorded"||tab==="live"){const id=yt(row.video_url||row.live_url);const label=tab==="live"?(row.status==="live"?"Live now":"Scheduled"):"Recorded lesson";d=card(row.title,[label,row.scheduled_start?new Date(row.scheduled_start).toLocaleString():"",row.description||""].filter(Boolean).join(" · "));if(id){const frame=document.createElement("iframe");frame.src="https://www.youtube-nocookie.com/embed/"+id;frame.title=row.title;frame.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";frame.allowFullscreen=true;d.append(frame)}else if(row.live_url||row.video_url){const a=document.createElement("a");a.href=row.live_url||row.video_url;a.target="_blank";a.rel="noopener noreferrer";a.textContent="Open video";d.append(a)}}else d=card(row.title,row.body);out.append(d)}if(!rows?.length)out.append(card("Nothing here yet","New academy content will appear here."))}catch(e){out.innerHTML="";msg(e.message)}}
async function start(session){if(!session)return;const {data,error}=await client.from("profiles").select("id,full_name,role,is_active").eq("id",session.user.id).single();if(error||!data||data.role!=="student"||!data.is_active){msg("Active student account required. Admins must use the admin portal.");await client.auth.signOut();return}profile=data;$("login").classList.add("hidden");$("portal").classList.remove("hidden");$("welcome").textContent="Welcome, "+(data.full_name||"Student");$("user").textContent=data.full_name||"Student";await loadContent()}
client.auth.onAuthStateChange((_event,session)=>{if(session)start(session)});client.auth.getSession().then(({data})=>start(data.session));
</script></body></html>
